morning_wake:
  cron: "0 * * * *"
  class: MorningWakeJob
  description: "Check participants whose local time is 07:00 and send wake"

checkin_evening:
  cron: "0 * * * *"
  class: CheckinEveningJob
  description: "Check participants whose local time is 20:00 and send check-in"

advance_day:
  cron: "0 6 * * *"
  class: AdvanceDayJob
  description: "Advance current_day for participants who completed yesterday's check-in"

daily_backup:
  cron: "0 3 * * *"
  class: DailyBackupJob
  description: "pg_dump database, upload to Google Drive, prune backups older than 7 days"

refresh_methodology_insights:
  cron: "30 3 * * *"
  class: RefreshMethodologyInsightsJob
  description: "Materialize MethodologyInsight rows (clusters, KPIs, prompt evolution) for the admin Metodología tabs"
