morning_wake:
  cron: "0 * * * *"
  class: MorningWakeJob
  description: "Check participants whose local time is 07:00 and send wake"

checkin_evening:
  cron: "0 * * * *"
  class: CheckinEveningJob
  description: "Check participants whose local time is 20:00 and send check-in"

advance_day:
  cron: "0 6 * * *"
  class: AdvanceDayJob
  description: "Advance current_day for participants who completed yesterday's check-in"

daily_backup:
  cron: "0 6 * * * America/Santiago"
  class: DailyBackupJob
  description: "pg_dump database, upload to Backblaze B2 (S3), prune backups older than 7 days"

refresh_methodology_insights:
  cron: "30 3 * * *"
  class: RefreshMethodologyInsightsJob
  description: "Materialize MethodologyInsight rows (clusters, KPIs, prompt evolution) for the admin Metodología tabs"

pause_inactive_participants:
  cron: "0 5 * * *"
  class: PauseInactiveParticipantsJob
  description: "Pause active participants with no inbound message in inactivity_pause_days days (an inbound reactivates them)"

expire_abandoned_intakes:
  cron: "30 5 * * *"
  class: ExpireAbandonedIntakesJob
  description: "Daily: revert participants stalled mid-intake (no activity in intake_abandonment_days) out of :intake so they're not stuck"

coach_session_reminder:
  cron: "0 * * * *"
  class: CoachSessionReminderJob
  description: "Hourly: WhatsApp reminder for confirmed 1-1 coach sessions starting within coach_session_reminder_lead_hours"

auto_prompt_tuning:
  cron: "0 4 * * 1"
  class: AutoPromptTuningJob
  description: "Weekly: score free-chat quality and optionally propose/apply guardrail improvements"

revalidate_resources:
  cron: "15 4 * * *"
  class: RevalidateResourcesJob
  description: "Daily: re-check stale approved resources and mark dead links"
