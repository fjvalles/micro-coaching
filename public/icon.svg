<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg-glow" cx="256" cy="256" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </radialGradient>

    <!-- Sleek Outer Border Gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f2937" stop-opacity="0.6" />
      <stop offset="0.5" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.6" />
    </linearGradient>

    <!-- Left Capsule: Initial Training (Indigo theme) -->
    <linearGradient id="left-capsule-grad" x1="214" y1="185" x2="214" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Right Capsule: Momentum / Sustained Behavior (Teal/Emerald theme) -->
    <linearGradient id="right-capsule-grad" x1="298" y1="95" x2="298" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34d399" />
      <stop offset="60%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Achievement Dot Radial Glow -->
    <radialGradient id="dot-glow" cx="342" cy="74" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Achievement Dot Gradient -->
    <linearGradient id="dot-grad" x1="326" y1="58" x2="358" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e6fdf5" />
      <stop offset="30%" stop-color="#34d399" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Drop Shadow Filter for SVG rendering browsers -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle Card -->
  <rect width="512" height="512" rx="120" fill="url(#bg-glow)" />
  <rect x="6" y="6" width="500" height="500" rx="114" stroke="url(#border-grad)" stroke-width="4" />

  <!-- Background decorative light rings (very subtle) -->
  <circle cx="256" cy="256" r="210" stroke="white" stroke-opacity="0.015" stroke-width="1" />
  <circle cx="256" cy="256" r="170" stroke="white" stroke-opacity="0.01" stroke-width="1" />

  <!-- Main Logo Group tilted at 28 degrees around center -->
  <g transform="rotate(28 256 256)" filter="url(#shadow)">
    <!-- Left Capsule (Capacitación Inicial) -->
    <rect x="188" y="185" width="52" height="175" rx="26" fill="url(#left-capsule-grad)" />
    <!-- Light Reflection overlay for realistic glass feel -->
    <rect x="193" y="190" width="42" height="80" rx="21" fill="white" fill-opacity="0.06" />

    <!-- Right Capsule (Impulso y Conducta Sostenida) -->
    <rect x="272" y="95" width="52" height="265" rx="26" fill="url(#right-capsule-grad)" />
    <!-- Light Reflection overlay for realistic glass feel -->
    <rect x="277" y="100" width="42" height="100" rx="21" fill="white" fill-opacity="0.08" />

    <!-- Achievement Dot Glow -->
    <circle cx="342" cy="74" r="28" fill="url(#dot-glow)" />

    <!-- Achievement Dot (Goal/Execution) -->
    <circle cx="342" cy="74" r="16" fill="url(#dot-grad)" stroke="#ffffff" stroke-width="3.5" />
  </g>
</svg>
